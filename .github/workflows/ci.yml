name: CI

on:
  pull_request:
  push:
    branches:
      - 'claude/continue-v2-development-**'

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 7 needs 20.19+ or 22.12+; 22 matches the development toolchain.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # `lint` is `tsc --noEmit`; there is no ESLint in this project.
      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      # Catches anything that typechecks but fails to bundle.
      - name: Build
        run: npm run build
