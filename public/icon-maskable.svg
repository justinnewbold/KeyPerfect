<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background for maskable icon (safe zone is center 80%) -->
  <rect width="512" height="512" fill="url(#gradMask)"/>
  <!-- Piano keys - centered in safe zone -->
  <g transform="translate(106, 180)">
    <!-- White keys -->
    <rect x="0" y="0" width="40" height="152" rx="4" fill="white"/>
    <rect x="48" y="0" width="40" height="152" rx="4" fill="white"/>
    <rect x="96" y="0" width="40" height="152" rx="4" fill="white"/>
    <rect x="144" y="0" width="40" height="152" rx="4" fill="white"/>
    <rect x="192" y="0" width="40" height="152" rx="4" fill="white"/>
    <rect x="240" y="0" width="40" height="152" rx="4" fill="white"/>
    <!-- Black keys -->
    <rect x="28" y="0" width="26" height="94" rx="3" fill="#1a1a2e"/>
    <rect x="76" y="0" width="26" height="94" rx="3" fill="#1a1a2e"/>
    <rect x="172" y="0" width="26" height="94" rx="3" fill="#1a1a2e"/>
    <rect x="220" y="0" width="26" height="94" rx="3" fill="#1a1a2e"/>
  </g>
</svg>
